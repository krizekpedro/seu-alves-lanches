<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Seu Alves · Cardápio e acompanhamento</title>
<link rel="icon" href="https://assets.olaclick.app/companies/logos/01bf6473-9273-413d-93dd-c51f71faf7b4.webp">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0F0F0F}
a{color:#FBBF24}a:hover{color:#F59E0B}
button{font-family:inherit;cursor:pointer}
.num{font-variant-numeric:tabular-nums}
</style>
<style>*{box-sizing:border-box}
html,body{height:100%}
body{display:flex;justify-content:center;align-items:center;min-height:100dvh;background:radial-gradient(circle at 50% 0%,#2a1212 0%,#0F0F0F 60%)}
#app>div{width:min(430px,100vw) !important;height:min(900px,100dvh) !important}
@media (min-width:500px){#app>div{border-radius:28px;border:1px solid rgba(245,158,11,.25);box-shadow:0 30px 80px rgba(0,0,0,.6)}}
.proto-back{position:fixed;left:12px;bottom:12px;z-index:50;padding:8px 12px;border-radius:99px;background:rgba(15,15,15,.85);border:1px solid rgba(245,158,11,.4);color:#FBBF24;font:600 12px Inter,system-ui,sans-serif;text-decoration:none}
@media (max-width:499px){.proto-phone .proto-back{display:none}}</style>
</head>
<body class="proto-phone">
<div id="app"></div>
<a class="proto-back" href="./">← Todas as telas</a>
<template id="tpl">
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #0F0F0F; color: #FAFAF9; font-family: Inter, system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden;">

  <div role="tablist" aria-label="Telas do cliente" style="display: flex; gap: 4px; margin: 14px 14px 0; padding: 4px; border-radius: 12px; background: #18181B; border: 1px solid rgba(255,255,255,.08);">
    <sc-for list="{{views}}" as="v" hint-placeholder-count="2">
      <button type="button" role="tab" onClick="{{v.pick}}" style="{{v.style}}">{{v.label}}</button>
    </sc-for>
  </div>

  <sc-if value="{{isMenu}}" hint-placeholder-val="{{ true }}">
    <div style="flex: 1 1 auto; overflow-y: auto; display: flex; flex-direction: column;">
      <div style="margin: 14px 14px 0; padding: 20px; border-radius: 18px; background: #7A1F1F; display: flex; flex-direction: column; gap: 8px;">
        <div style="display: flex; align-items: center; gap: 12px;">
          <div style="width: 48px; height: 48px; border-radius: 14px; background: #0F0F0F; border: 1px solid rgba(245,158,11,.6); display: flex; align-items: center; justify-content: center; font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 800; font-size: 16px; color: #F5E9D7; overflow: hidden; padding: 0;"><img src="https://assets.olaclick.app/companies/logos/01bf6473-9273-413d-93dd-c51f71faf7b4.webp" alt="Seu Alves Lanches" style="width: 100%; height: 100%; object-fit: cover;" onerror="this.replaceWith('SA')"></div>
          <div style="display: flex; flex-direction: column;">
            <span style="font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 800; font-size: 20px; color: #F5E9D7;">Seu Alves Lanches</span>
            <span style="font-size: 12px; color: #E7D2B3;">Vila Kosmos · aberto até 23h30</span>
          </div>
        </div>
        <div style="display: flex; flex-wrap: wrap; gap: 6px;">
          <span style="font-size: 12px; font-weight: 700; padding: 5px 10px; border-radius: 99px; background: rgba(15,15,15,.45); color: #F5E9D7;">Entrega em ~45 min</span>
          <span style="font-size: 12px; font-weight: 700; padding: 5px 10px; border-radius: 99px; background: #F59E0B; color: #0F0F0F;">Você tem R$ 6,40 de cashback</span>
        </div>
      </div>
      <div role="group" aria-label="Categorias" style="display: flex; gap: 8px; padding: 14px; overflow-x: auto;">
        <sc-for list="{{cats}}" as="c" hint-placeholder-count="3">
          <button type="button" onClick="{{c.pick}}" style="{{c.style}}">{{c.label}}</button>
        </sc-for>
      </div>
      <div style="display: flex; flex-direction: column; gap: 10px; padding: 0 14px 14px;">
        <sc-for list="{{items}}" as="p" hint-placeholder-count="5">
          <div style="display: flex; gap: 12px; padding: 12px; border-radius: 16px; background: #18181B; border: 1px solid rgba(255,255,255,.08);">
            <div style="flex: 1 1 auto; display: flex; flex-direction: column; gap: 4px;">
              <span style="font-size: 15px; font-weight: 700; color: {{p.nameColor}};">{{p.name}}</span>
              <span style="font-size: 12px; color: #A1A1AA; line-height: 1.35;">{{p.desc}}</span>
              <span class="num" style="font-size: 15px; font-weight: 800; color: {{p.priceColor}};">{{p.price}}</span>
            </div>
            <div style="display: flex; flex-direction: column; align-items: flex-end; justify-content: space-between; gap: 8px;">
              <div style="width: 76px; height: 64px; border-radius: 12px; background: #202024; border: 1px dashed rgba(255,255,255,.14); display: flex; align-items: center; justify-content: center; font-size: 10px; color: #71717A; text-align: center;">foto</div>
              <button type="button" onClick="{{p.add}}" aria-label="{{p.aria}}" style="{{p.btnStyle}}">{{p.btn}}</button>
            </div>
          </div>
        </sc-for>
      </div>
    </div>
    <div style="padding: 12px 14px 18px; background: #0A0A0A; border-top: 1px solid rgba(255,255,255,.08);">
      <button type="button" onClick="{{checkout}}" style="width: 100%; min-height: 56px; border-radius: 14px; border: none; background: #F59E0B; color: #0F0F0F; font-weight: 800; font-size: 16px; display: flex; align-items: center; justify-content: space-between; padding: 0 18px;">
        <span>{{cartCount}}</span><span>Pagar com Pix</span><span class="num">{{cartTotal}}</span>
      </button>
    </div>
  </sc-if>

  <sc-if value="{{isTrack}}" hint-placeholder-val="{{ false }}">
    <div style="flex: 1 1 auto; overflow-y: auto; padding: 14px; display: flex; flex-direction: column; gap: 14px;">
      <div style="padding: 20px; border-radius: 18px; background: #18181B; border: 1px solid rgba(255,255,255,.08); display: flex; flex-direction: column; gap: 6px;">
        <span style="font-size: 13px; color: #A1A1AA;">Pedido #1053 · Seu Alves</span>
        <span style="font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 800; font-size: 24px; line-height: 1.15;">{{headline}}</span>
        <span class="num" style="font-size: 15px; color: #FBBF24; font-weight: 700;">{{eta}}</span>
      </div>
      <div style="height: 150px; border-radius: 18px; background: #18181B; border: 1px solid rgba(255,255,255,.08); position: relative; overflow: hidden;">
        <div style="position: absolute; left: 30px; top: 100px; width: 14px; height: 14px; border-radius: 99px; background: #F59E0B; border: 3px solid #0F0F0F;"></div>
        <div style="position: absolute; left: 44px; top: 104px; width: {{routeW}}px; height: 4px; border-radius: 99px; background: #F59E0B;"></div>
        <div style="position: absolute; left: {{bikeX}}px; top: 92px; width: 28px; height: 28px; border-radius: 99px; background: #7A1F1F; color: #F5E9D7; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 800; border: 2px solid #F59E0B;">LE</div>
        <div style="position: absolute; right: 30px; top: 40px; width: 16px; height: 16px; border-radius: 4px; background: #22C55E; border: 3px solid #0F0F0F;"></div>
        <span style="position: absolute; left: 14px; top: 12px; font-size: 11px; color: #A1A1AA;">mapa ao vivo (na versão final)</span>
      </div>
      <div style="padding: 18px; border-radius: 18px; background: #18181B; border: 1px solid rgba(255,255,255,.08); display: flex; flex-direction: column; gap: 0;">
        <sc-for list="{{steps}}" as="s" hint-placeholder-count="5">
          <div style="display: flex; gap: 14px;">
            <div style="display: flex; flex-direction: column; align-items: center; width: 22px;">
              <span style="width: 22px; height: 22px; border-radius: 99px; background: {{s.dotBg}}; border: 2px solid {{s.dotBorder}}; color: #0F0F0F; font-size: 12px; font-weight: 900; display: flex; align-items: center; justify-content: center; box-sizing: border-box;">{{s.mark}}</span>
              <sc-if value="{{s.notLast}}" hint-placeholder-val="{{ true }}">
                <span style="flex: 1 1 auto; width: 2px; min-height: 26px; background: {{s.lineColor}};"></span>
              </sc-if>
            </div>
            <div style="display: flex; flex-direction: column; gap: 2px; padding-bottom: 16px;">
              <span style="font-size: 15px; font-weight: 700; color: {{s.color}};">{{s.label}}</span>
              <span class="num" style="font-size: 12px; color: #A1A1AA;">{{s.time}}</span>
            </div>
          </div>
        </sc-for>
      </div>
      <sc-if value="{{delivered}}" hint-placeholder-val="{{ false }}">
        <div style="padding: 18px; border-radius: 18px; background: #7A1F1F; display: flex; flex-direction: column; gap: 10px; align-items: center;">
          <span style="font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 800; font-size: 18px; color: #F5E9D7;">Como foi seu pedido?</span>
          <div role="group" aria-label="Nota de 1 a 5" style="display: flex; gap: 6px;">
            <sc-for list="{{rate}}" as="r" hint-placeholder-count="5">
              <button type="button" onClick="{{r.pick}}" aria-label="{{r.aria}}" style="{{r.style}}">★</button>
            </sc-for>
          </div>
          <span style="font-size: 12px; color: #E7D2B3;">{{rateMsg}}</span>
        </div>
      </sc-if>
      <button type="button" onClick="{{advance}}" style="min-height: 48px; border-radius: 12px; border: 1px dashed rgba(245,158,11,.5); background: transparent; color: #FBBF24; font-weight: 700; font-size: 14px;">{{advanceLabel}}</button>
      <span style="font-size: 12px; color: #A1A1AA; text-align: center;">Dúvidas? <a href="#">Falar com a loja no WhatsApp</a></span>
    </div>
  </sc-if>
</div>
</template>
<script>
/* Mini motor de telas do protótipo: lê o <template id="tpl"> e redesenha a cada setState.
   Suporta {{valor}}, <sc-if value>, <sc-for list as> e onClick/onChange. */
(function () {
  var EXACT = /^\s*\{\{\s*([^}]+?)\s*\}\}\s*$/;
  function get(scope, expr) {
    expr = expr.trim();
    if (expr === 'true') return true;
    if (expr === 'false') return false;
    if (/^-?\d+(\.\d+)?$/.test(expr)) return +expr;
    var parts = expr.split('.');
    for (var i = scope.length - 1; i >= 0; i--) {
      var s = scope[i];
      if (s && Object.prototype.hasOwnProperty.call(s, parts[0])) {
        var v = s[parts[0]];
        for (var j = 1; j < parts.length; j++) v = v == null ? undefined : v[parts[j]];
        return v;
      }
    }
    return undefined;
  }
  function interp(str, scope) {
    return str.replace(/\{\{([^}]+)\}\}/g, function (_, e) { var v = get(scope, e); return v == null ? '' : String(v); });
  }
  function exprOf(attr) { var m = EXACT.exec(attr || ''); return m ? m[1] : null; }
  var EVENTS = { onclick: 'click', onchange: 'input', oninput: 'input' };
  function build(node, scope, out) {
    if (node.nodeType === 3) { out.push(document.createTextNode(interp(node.nodeValue, scope))); return; }
    if (node.nodeType !== 1) return;
    var tag = node.localName;
    if (tag === 'sc-if') {
      if (get(scope, exprOf(node.getAttribute('value')) || 'false')) node.childNodes.forEach(function (c) { build(c, scope, out); });
      return;
    }
    if (tag === 'sc-for') {
      var list = get(scope, exprOf(node.getAttribute('list')) || '') || [], as = node.getAttribute('as');
      list.forEach(function (item) { var o = {}; o[as] = item; var sc = scope.concat([o]); node.childNodes.forEach(function (c) { build(c, sc, out); }); });
      return;
    }
    var el = node.namespaceURI === 'http://www.w3.org/1999/xhtml' ? document.createElement(tag) : document.createElementNS(node.namespaceURI, node.tagName);
    for (var i = 0; i < node.attributes.length; i++) {
      var a = node.attributes[i], name = a.name.toLowerCase();
      if (name.indexOf('hint-') === 0) continue;
      var ex = exprOf(a.value);
      if (EVENTS[name] && ex) { (function (fn) { if (typeof fn === 'function') el.addEventListener(EVENTS[name], function (e) { fn(e); }); })(get(scope, ex)); continue; }
      el.setAttribute(a.name, interp(a.value, scope));
    }
    var kids = [];
    node.childNodes.forEach(function (c) { build(c, scope, kids); });
    kids.forEach(function (k) { el.appendChild(k); });
    out.push(el);
  }
  var SCROLLERS = '[style*="overflow-y: auto"],[style*="overflow: auto"],[style*="overflow-x: auto"]';
  window.DCLogic = function DCLogic(props) { this.props = props || {}; this.state = {}; };
  window.DCLogic.prototype.setState = function (o) {
    Object.assign(this.state, typeof o === 'function' ? o(this.state) : o);
    if (this.__render && !this.__queued) { var self = this; this.__queued = true; Promise.resolve().then(function () { self.__queued = false; self.__render(); }); }
  };
  window.DC = {
    mount: function (Component) {
      var app = document.getElementById('app'), tpl = document.getElementById('tpl').content, comp = new Component({});
      comp.__render = function () {
        var scrolls = Array.prototype.map.call(app.querySelectorAll(SCROLLERS), function (e) { return [e.scrollTop, e.scrollLeft]; });
        var fields = app.querySelectorAll('input,textarea,select'), act = document.activeElement, fi = Array.prototype.indexOf.call(fields, act), sel = fi >= 0 && act.selectionStart != null ? [act.selectionStart, act.selectionEnd] : null;
        var vals = comp.renderVals(), out = [];
        tpl.childNodes.forEach(function (c) { build(c, [vals], out); });
        app.replaceChildren.apply(app, out);
        app.querySelectorAll(SCROLLERS).forEach(function (e, i) { if (scrolls[i]) { e.scrollTop = scrolls[i][0]; e.scrollLeft = scrolls[i][1]; } });
        if (fi >= 0) { var nf = app.querySelectorAll('input,textarea,select')[fi]; if (nf) { nf.focus(); if (sel && nf.setSelectionRange) try { nf.setSelectionRange(sel[0], sel[1]); } catch (e) {} } }
      };
      comp.__render();
    }
  };
})();

</script>
<script>

class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { view: 'menu', cat: 'burgers', cart: { onion: 1 }, step: 2, stars: 0 };
  }
  brl(n) { return n.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' }); }
  renderVals() {
    var self = this, st = this.state;
    function chip(on) {
      return 'flex:0 0 auto;min-height:40px;padding:0 16px;border-radius:99px;font-size:14px;font-weight:700;white-space:nowrap;border:1px solid ' + (on ? '#F59E0B' : 'rgba(255,255,255,.12)') + ';background:' + (on ? '#F59E0B' : '#18181B') + ';color:' + (on ? '#0F0F0F' : '#E4E4E7') + ';';
    }
    var views = [['menu', 'Cardápio'], ['track', 'Acompanhar pedido']].map(function (v) {
      var on = st.view === v[0];
      return { label: v[1], pick: function () { self.setState({ view: v[0] }); },
        style: 'flex:1 1 0;min-height:40px;border-radius:9px;border:none;font-size:13px;font-weight:700;background:' + (on ? '#F59E0B' : 'transparent') + ';color:' + (on ? '#0F0F0F' : '#D4D4D8') + ';' };
    });
    var cats = [['combos', 'Combos'], ['burgers', 'Hambúrgueres'], ['batatas', 'Batatas']].map(function (c) {
      return { label: c[1], style: chip(st.cat === c[0]), pick: function () { self.setState({ cat: c[0] }); } };
    });
    var menu = [
      { id: 'casal', cat: 'combos', name: 'Combo Casal', desc: '2 hambúrgueres, batata M e 2 refris.', price: 42 },
      { id: 'familia', cat: 'combos', name: 'Combo Família Alves', desc: '4 hambúrgueres, batata G e refri 2 L.', price: 89.9 },
      { id: 'xalves', cat: 'burgers', name: 'X-Alves', desc: 'Blend 180 g, cheddar, bacon e molho da casa no brioche.', price: 25 },
      { id: 'onion', cat: 'burgers', name: 'Duplo Onion Artesanal', desc: 'Dois blends, cebola caramelizada e cheddar.', price: 28 },
      { id: 'toscano', cat: 'burgers', name: 'Toscano Artesanal', desc: 'Linguiça toscana artesanal, queijo e vinagrete.', price: 30, out: true },
      { id: 'p2', cat: 'burgers', name: 'P2 - Duplo Picanha', desc: 'Dois discos de picanha com queijo.', price: 19 },
      { id: 'batm', cat: 'batatas', name: 'Batata M (2 pessoas)', desc: 'Batata crocante, porção para dois.', price: 14 },
      { id: 'maluca', cat: 'batatas', name: 'Batata Maluca', desc: 'Batata com cheddar, bacon e calabresa.', price: 35 }
    ];
    var total = 0, count = 0;
    menu.forEach(function (m) { var q = st.cart[m.id] || 0; total += q * m.price; count += q; });
    var items = menu.filter(function (m) { return m.cat === st.cat; }).map(function (m) {
      var q = st.cart[m.id] || 0;
      return { name: m.name, desc: m.desc, price: m.out ? 'Esgotado hoje' : self.brl(m.price),
        nameColor: m.out ? '#71717A' : '#FAFAF9', priceColor: m.out ? '#71717A' : '#FBBF24',
        btn: m.out ? '—' : (q ? q + ' no pedido' : 'Adicionar'), aria: 'Adicionar ' + m.name,
        btnStyle: 'min-height:40px;padding:0 12px;border-radius:10px;font-size:13px;font-weight:800;border:none;background:' + (m.out ? '#27272A' : (q ? '#F59E0B' : '#7A1F1F')) + ';color:' + (m.out ? '#71717A' : (q ? '#0F0F0F' : '#F5E9D7')) + ';',
        add: function () { if (m.out) return; var c = Object.assign({}, self.state.cart); c[m.id] = (c[m.id] || 0) + 1; self.setState({ cart: c }); } };
    });
    var stepDefs = [
      ['Pedido recebido', '21:42'], ['Aceito pela cozinha', '21:43'], ['Em preparo', 'desde 21:43'], ['Saiu para entrega com Léo', '21:58'], ['Entregue', '22:11']
    ];
    var heads = ['Recebemos seu pedido!', 'A cozinha aceitou seu pedido.', 'Seu lanche está na chapa.', 'Saiu para entrega com o Léo.', 'Pedido entregue. Bom apetite!'];
    var etas = ['Chega entre 22:15 e 22:25', 'Chega entre 22:15 e 22:25', 'Chega entre 22:12 e 22:20', 'Chega em cerca de 12 min', 'Entregue às 22:11'];
    var steps = stepDefs.map(function (sd, i) {
      var done = i < st.step, cur = i === st.step;
      return { label: sd[0], time: done || cur ? sd[1] : 'aguardando', notLast: i < stepDefs.length - 1,
        mark: done ? '✓' : '', dotBg: done ? '#22C55E' : (cur ? '#F59E0B' : 'transparent'), dotBorder: done ? '#22C55E' : (cur ? '#F59E0B' : '#3F3F46'),
        lineColor: done ? '#22C55E' : '#3F3F46', color: done || cur ? '#FAFAF9' : '#71717A' };
    });
    var delivered = st.step >= 4;
    var progress = Math.min(st.step, 4) / 4;
    var rate = [1, 2, 3, 4, 5].map(function (n) {
      var on = n <= st.stars;
      return { aria: n + ' estrelas', pick: function () { self.setState({ stars: n }); },
        style: 'width:44px;height:44px;border-radius:10px;border:none;font-size:22px;background:' + (on ? '#F59E0B' : 'rgba(15,15,15,.45)') + ';color:' + (on ? '#0F0F0F' : '#E7D2B3') + ';' };
    });
    return {
      views: views, isMenu: st.view === 'menu', isTrack: st.view === 'track', cats: cats, items: items,
      cartCount: count + (count === 1 ? ' item' : ' itens'), cartTotal: this.brl(total),
      checkout: function () { if (count) self.setState({ view: 'track', step: 0, stars: 0 }); },
      headline: heads[Math.min(st.step, 4)], eta: etas[Math.min(st.step, 4)], steps: steps, delivered: delivered,
      routeW: Math.round(270 * progress), bikeX: 30 + Math.round(270 * progress),
      advance: function () { self.setState({ step: self.state.step >= 4 ? 0 : self.state.step + 1, stars: 0 }); },
      advanceLabel: st.step >= 4 ? 'Simular de novo' : 'Simular próxima etapa',
      rate: rate, rateMsg: st.stars ? (st.stars >= 4 ? 'Obrigado! Você ganhou R$ 2 de cashback.' : 'Sentimos muito. O Felipe vai falar com você no WhatsApp.') : 'Sua nota ajuda a gente a melhorar.'
    };
  }
}

DC.mount(Component);
</script>
</body>
</html>
