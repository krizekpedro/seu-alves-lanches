<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Seu Alves · Cardápio e acompanhamento</title>
<link rel="icon" href="../assets/img/logo.webp">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0F0F0F}
a{color:#FBBF24}a:hover{color:#F59E0B}
button{font-family:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid #FBBF24;outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.cl-root{width:100%;min-height:100vh;box-sizing:border-box;background:#0F0F0F;color:#FAFAF9;font-family:Inter,system-ui,sans-serif;padding-bottom:96px}
.cl-wrap{max-width:1180px;margin:0 auto;padding:0 16px;box-sizing:border-box}
.cl-layout{display:grid;grid-template-columns:minmax(0,1fr);gap:20px;align-items:start}
.cl-items{display:grid;grid-template-columns:minmax(0,1fr);gap:12px}
.cl-side{display:none}
.cl-bar{position:fixed;left:0;right:0;bottom:0;z-index:20;padding:12px 16px 16px;background:linear-gradient(180deg,rgba(15,15,15,0),#0F0F0F 30%)}
.cl-card{background:#18181B;border:1px solid rgba(255,255,255,.08);border-radius:18px}
.cl-inp{width:100%;box-sizing:border-box;min-height:46px;padding:10px 14px;border-radius:12px;border:1px solid rgba(255,255,255,.12);background:#0F0F0F;color:#FAFAF9;font:500 15px Inter,system-ui,sans-serif}
.cl-inp:focus{outline:none;border-color:#F59E0B}
.cl-sheet{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.6);display:flex;align-items:flex-end;justify-content:center}
.cl-sheet>div{width:100%;max-width:560px;max-height:92vh;overflow-y:auto;background:#141416;border-radius:22px 22px 0 0;border:1px solid rgba(245,158,11,.25)}
.cl-track{display:grid;grid-template-columns:minmax(0,1fr);gap:14px;max-width:760px;margin:0 auto}
@media (min-width:900px){
  .cl-root{padding-bottom:24px}
  .cl-layout{grid-template-columns:minmax(0,1fr) 360px}
  .cl-items{grid-template-columns:repeat(2,minmax(0,1fr))}
  .cl-side{display:flex;position:sticky;top:16px}
  .cl-bar{display:none}
  .cl-sheet{align-items:center}
  .cl-sheet>div{border-radius:22px}
}
</style>
<style>*{box-sizing:border-box}
.proto-back{position:fixed;left:12px;bottom:12px;z-index:50;padding:8px 12px;border-radius:99px;background:rgba(15,15,15,.85);border:1px solid rgba(245,158,11,.4);color:#FBBF24;font:600 12px Inter,system-ui,sans-serif;text-decoration:none}
@media (max-width:499px){.proto-phone .proto-back{display:none}}
@media (max-width:899px){.proto-top .proto-back{top:10px;bottom:auto;left:auto;right:10px}}</style>
</head>
<body class=" proto-top">
<div id="app"></div>
<a class="proto-back" href="./">← Todas as telas</a>
<template id="tpl">
<div class="cl-root">
  <sc-if value="{{isMenu}}" hint-placeholder-val="{{ true }}">
    <div style="position: relative; height: 190px; overflow: hidden; background: #7A1F1F;">
      <img src="{{banner}}" alt="" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: .45;">
      <div style="position: absolute; inset: 0; background: linear-gradient(180deg, rgba(15,15,15,.1), #0F0F0F);"></div>
    </div>
    <div class="cl-wrap" style="margin-top: -92px; position: relative;">
      <div style="display: flex; align-items: flex-end; gap: 14px; flex-wrap: wrap;">
        <img src="{{logo}}" alt="Seu Alves Lanches" style="width: 84px; height: 84px; border-radius: 22px; border: 2px solid rgba(245,158,11,.7); object-fit: cover; background: #0F0F0F;">
        <div style="display: flex; flex-direction: column; gap: 4px; min-width: 0; flex: 1 1 200px;">
          <h1 style="margin: 0; font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 800; font-size: 26px; color: #F5E9D7;">Seu Alves Lanches</h1>
          <span style="font-size: 13px; color: #E7D2B3;"><span style="color: #22C55E;">●</span> Aberto até 2h · Vila Kosmos</span>
        </div>
        <button type="button" onClick="{{goTrack}}" style="min-height: 40px; padding: 0 14px; border-radius: 99px; border: 1px solid rgba(245,158,11,.5); background: rgba(15,15,15,.6); color: #FBBF24; font-weight: 700; font-size: 13px;">{{trackBtn}}</button>
      </div>
      <div style="display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px;">
        <span style="font-size: 12px; font-weight: 700; padding: 6px 12px; border-radius: 99px; background: #18181B; border: 1px solid rgba(255,255,255,.1); color: #F5E9D7;">🛵 Entrega 35 a 50 min</span>
        <span style="font-size: 12px; font-weight: 700; padding: 6px 12px; border-radius: 99px; background: #18181B; border: 1px solid rgba(255,255,255,.1); color: #F5E9D7;">🏪 Retirada em 20 min</span>
        <span style="font-size: 12px; font-weight: 700; padding: 6px 12px; border-radius: 99px; background: #F59E0B; color: #0F0F0F;">Você tem R$ 6,40 de cashback</span>
      </div>

      <div class="cl-layout" style="margin-top: 18px;">
        <div style="display: flex; flex-direction: column; gap: 14px; min-width: 0;">
          <input class="cl-inp" type="search" placeholder="Buscar no cardápio (ex.: bacon, batata, açaí)" value="{{q}}" onChange="{{search}}" aria-label="Buscar no cardápio">
          <div role="group" aria-label="Categorias" style="display: flex; flex-wrap: wrap; gap: 8px;">
            <sc-for list="{{cats}}" as="c" hint-placeholder-count="8">
              <button type="button" onClick="{{c.pick}}" style="{{c.style}}">{{c.label}}</button>
            </sc-for>
          </div>
          <sc-for list="{{sections}}" as="s" hint-placeholder-count="3">
            <div style="display: flex; flex-direction: column; gap: 10px;">
              <h2 style="margin: 6px 0 0; font-family: 'Plus Jakarta Sans', sans-serif; font-size: 18px; font-weight: 800; color: #F5E9D7;">{{s.title}}</h2>
              <div class="cl-items">
                <sc-for list="{{s.items}}" as="p" hint-placeholder-count="4">
                  <button type="button" onClick="{{p.open}}" aria-label="{{p.aria}}" class="cl-card" style="display: flex; gap: 12px; padding: 12px; text-align: left; color: inherit; opacity: {{p.op}};">
                    <div style="flex: 1 1 auto; display: flex; flex-direction: column; gap: 6px; min-width: 0;">
                      <span style="font-size: 15px; font-weight: 700;">{{p.name}}</span>
                      <span style="font-size: 12px; color: #A1A1AA; line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;">{{p.desc}}</span>
                      <span class="num" style="margin-top: auto; font-size: 15px; font-weight: 800; color: {{p.priceColor}};">{{p.price}}</span>
                    </div>
                    <div style="position: relative; flex: 0 0 auto; width: 104px; height: 104px; border-radius: 14px; overflow: hidden; background: #202024;">
                      <img src="{{p.img}}" alt="" loading="lazy" style="width: 100%; height: 100%; object-fit: cover;">
                      <span style="position: absolute; right: 6px; bottom: 6px; min-width: 30px; height: 30px; padding: 0 8px; box-sizing: border-box; border-radius: 99px; background: {{p.badgeBg}}; color: {{p.badgeFg}}; font-size: 13px; font-weight: 800; display: flex; align-items: center; justify-content: center;">{{p.badge}}</span>
                    </div>
                  </button>
                </sc-for>
              </div>
            </div>
          </sc-for>
          <sc-if value="{{noResults}}" hint-placeholder-val="{{ false }}">
            <div class="cl-card" style="padding: 20px; text-align: center; color: #A1A1AA; font-size: 14px;">Nada encontrado para "{{q}}".</div>
          </sc-if>
        </div>

        <aside class="cl-side cl-card" aria-label="Seu pedido" style="flex-direction: column; gap: 12px; padding: 16px;">
          <div style="display: flex; gap: 6px;"><sc-for list="{{tipos}}" as="t" hint-placeholder-count="2"><button type="button" onClick="{{t.pick}}" style="{{t.style}}">{{t.label}}</button></sc-for></div>
          <sc-if value="{{emptyCart}}" hint-placeholder-val="{{ false }}"><span style="font-size: 14px; color: #A1A1AA; padding: 10px 0;">Seu pedido está vazio. Toque num lanche para adicionar.</span></sc-if>
          <sc-for list="{{lines}}" as="l" hint-placeholder-count="2">
            <div style="display: flex; gap: 10px; align-items: center;">
              <img src="{{l.img}}" alt="" style="width: 48px; height: 48px; border-radius: 10px; object-fit: cover; flex: 0 0 auto;">
              <div style="flex: 1 1 auto; display: flex; flex-direction: column; gap: 2px; min-width: 0;"><span style="font-size: 14px; font-weight: 700;">{{l.name}}</span><span style="font-size: 12px; color: #A1A1AA;">{{l.extras}}</span></div>
              <span class="num" style="font-size: 14px; font-weight: 700;">{{l.price}}</span>
              <button type="button" aria-label="Remover" onClick="{{l.remove}}" style="width: 32px; height: 32px; border-radius: 99px; border: 1px solid rgba(255,255,255,.12); background: transparent; color: #A1A1AA;">✕</button>
            </div>
          </sc-for>
          <sc-if value="{{isEntrega}}" hint-placeholder-val="{{ true }}">
            <div style="display: flex; flex-direction: column; gap: 6px;"><span style="font-size: 12px; color: #A1A1AA;">Bairro de entrega</span><div style="display: flex; flex-wrap: wrap; gap: 6px;"><sc-for list="{{bairros}}" as="b" hint-placeholder-count="5"><button type="button" onClick="{{b.pick}}" style="{{b.style}}">{{b.label}}</button></sc-for></div></div>
          </sc-if>
          <div style="display: flex; flex-direction: column; gap: 6px;"><span style="font-size: 12px; color: #A1A1AA;">Pagamento</span><div style="display: flex; flex-wrap: wrap; gap: 6px;"><sc-for list="{{pays}}" as="p" hint-placeholder-count="3"><button type="button" onClick="{{p.pick}}" style="{{p.style}}">{{p.label}}</button></sc-for></div></div>
          <div style="display: flex; flex-direction: column; gap: 6px; padding-top: 10px; border-top: 1px solid rgba(255,255,255,.08); font-size: 14px;">
            <div style="display: flex; justify-content: space-between;"><span style="color: #A1A1AA;">Subtotal</span><span class="num">{{subTxt}}</span></div>
            <div style="display: flex; justify-content: space-between;"><span style="color: #A1A1AA;">Taxa de entrega</span><span class="num">{{feeTxt}}</span></div>
            <div style="display: flex; justify-content: space-between;"><span style="color: #A1A1AA;">Cashback</span><button type="button" onClick="{{toggleCash}}" style="{{cashStyle}}">{{cashTxt}}</button></div>
            <div style="display: flex; justify-content: space-between; font-size: 18px; font-weight: 800;"><span>Total</span><span class="num" style="color: #FBBF24;">{{totalTxt}}</span></div>
          </div>
          <button type="button" onClick="{{finish}}" style="{{finishStyle}}">Fazer pedido</button>
        </aside>
      </div>
    </div>

    <div class="cl-bar">
      <button type="button" onClick="{{openCart}}" style="width: 100%; min-height: 58px; border-radius: 16px; border: none; background: {{barBg}}; color: #0F0F0F; font-weight: 800; font-size: 16px; display: flex; align-items: center; justify-content: space-between; padding: 0 18px;">
        <span>{{cartCount}}</span><span>{{barLabel}}</span><span class="num">{{cartTotal}}</span>
      </button>
    </div>

    <sc-if value="{{cartOpen}}" hint-placeholder-val="{{ false }}">
      <div class="cl-sheet">
        <div role="dialog" aria-label="Seu pedido" style="padding: 18px; display: flex; flex-direction: column; gap: 12px;">
          <div style="display: flex; justify-content: space-between; align-items: center;"><span style="font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 800; font-size: 18px;">Seu pedido</span><button type="button" aria-label="Fechar" onClick="{{closeCart}}" style="width: 40px; height: 40px; border-radius: 99px; border: 1px solid rgba(255,255,255,.12); background: transparent; color: #FAFAF9; font-size: 18px;">✕</button></div>
          <div style="display: flex; gap: 6px;"><sc-for list="{{tipos}}" as="t" hint-placeholder-count="2"><button type="button" onClick="{{t.pick}}" style="{{t.style}}">{{t.label}}</button></sc-for></div>
          <sc-if value="{{emptyCart}}" hint-placeholder-val="{{ false }}"><span style="font-size: 14px; color: #A1A1AA; padding: 10px 0;">Seu pedido está vazio. Toque num lanche para adicionar.</span></sc-if>
          <sc-for list="{{lines}}" as="l" hint-placeholder-count="2">
            <div style="display: flex; gap: 10px; align-items: center;">
              <img src="{{l.img}}" alt="" style="width: 48px; height: 48px; border-radius: 10px; object-fit: cover; flex: 0 0 auto;">
              <div style="flex: 1 1 auto; display: flex; flex-direction: column; gap: 2px; min-width: 0;"><span style="font-size: 14px; font-weight: 700;">{{l.name}}</span><span style="font-size: 12px; color: #A1A1AA;">{{l.extras}}</span></div>
              <span class="num" style="font-size: 14px; font-weight: 700;">{{l.price}}</span>
              <button type="button" aria-label="Remover" onClick="{{l.remove}}" style="width: 32px; height: 32px; border-radius: 99px; border: 1px solid rgba(255,255,255,.12); background: transparent; color: #A1A1AA;">✕</button>
            </div>
          </sc-for>
          <sc-if value="{{isEntrega}}" hint-placeholder-val="{{ true }}">
            <div style="display: flex; flex-direction: column; gap: 6px;"><span style="font-size: 12px; color: #A1A1AA;">Bairro de entrega</span><div style="display: flex; flex-wrap: wrap; gap: 6px;"><sc-for list="{{bairros}}" as="b" hint-placeholder-count="5"><button type="button" onClick="{{b.pick}}" style="{{b.style}}">{{b.label}}</button></sc-for></div></div>
          </sc-if>
          <div style="display: flex; flex-direction: column; gap: 6px;"><span style="font-size: 12px; color: #A1A1AA;">Pagamento</span><div style="display: flex; flex-wrap: wrap; gap: 6px;"><sc-for list="{{pays}}" as="p" hint-placeholder-count="3"><button type="button" onClick="{{p.pick}}" style="{{p.style}}">{{p.label}}</button></sc-for></div></div>
          <div style="display: flex; flex-direction: column; gap: 6px; padding-top: 10px; border-top: 1px solid rgba(255,255,255,.08); font-size: 14px;">
            <div style="display: flex; justify-content: space-between;"><span style="color: #A1A1AA;">Subtotal</span><span class="num">{{subTxt}}</span></div>
            <div style="display: flex; justify-content: space-between;"><span style="color: #A1A1AA;">Taxa de entrega</span><span class="num">{{feeTxt}}</span></div>
            <div style="display: flex; justify-content: space-between;"><span style="color: #A1A1AA;">Cashback</span><button type="button" onClick="{{toggleCash}}" style="{{cashStyle}}">{{cashTxt}}</button></div>
            <div style="display: flex; justify-content: space-between; font-size: 18px; font-weight: 800;"><span>Total</span><span class="num" style="color: #FBBF24;">{{totalTxt}}</span></div>
          </div>
          <button type="button" onClick="{{finish}}" style="{{finishStyle}}">Fazer pedido</button>
        </div>
      </div>
    </sc-if>

    <sc-if value="{{modalOpen}}" hint-placeholder-val="{{ false }}">
      <div class="cl-sheet">
        <div role="dialog" aria-label="{{mName}}" style="display: flex; flex-direction: column;">
          <div style="position: relative; height: 240px; background: #202024;">
            <img src="{{mImg}}" alt="{{mName}}" style="width: 100%; height: 100%; object-fit: cover;">
            <button type="button" aria-label="Fechar" onClick="{{closeModal}}" style="position: absolute; top: 12px; right: 12px; width: 40px; height: 40px; border-radius: 99px; border: none; background: rgba(15,15,15,.75); color: #FAFAF9; font-size: 18px;">✕</button>
          </div>
          <div style="padding: 18px; display: flex; flex-direction: column; gap: 12px;">
            <span style="font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 800; font-size: 22px;">{{mName}}</span>
            <span style="font-size: 14px; color: #D4D4D8; line-height: 1.45;">{{mDesc}}</span>
            <span class="num" style="font-size: 18px; font-weight: 800; color: #FBBF24;">{{mPrice}}</span>
            <sc-for list="{{mGroups}}" as="g" hint-placeholder-count="2">
              <div style="display: flex; flex-direction: column; gap: 6px; padding-top: 8px; border-top: 1px solid rgba(255,255,255,.08);">
                <div style="display: flex; justify-content: space-between; align-items: baseline; gap: 8px;"><span style="font-weight: 700; font-size: 15px;">{{g.name}}</span><span style="font-size: 12px; color: #A1A1AA;">{{g.rule}}</span></div>
                <sc-for list="{{g.opts}}" as="o" hint-placeholder-count="4">
                  <button type="button" role="checkbox" aria-checked="{{o.aria}}" onClick="{{o.toggle}}" style="display: flex; align-items: center; gap: 10px; min-height: 46px; padding: 0 12px; border-radius: 12px; border: 1px solid {{o.border}}; background: {{o.bg}}; color: #FAFAF9; text-align: left;">
                    <span style="width: 22px; height: 22px; border-radius: 6px; border: 2px solid {{o.border}}; background: {{o.box}}; color: #0F0F0F; font-size: 13px; font-weight: 900; display: flex; align-items: center; justify-content: center; flex: 0 0 auto;">{{o.mark}}</span>
                    <span style="flex: 1 1 auto; font-size: 14px;">{{o.name}}</span>
                    <span class="num" style="font-size: 13px; color: #FBBF24; font-weight: 700;">{{o.price}}</span>
                  </button>
                </sc-for>
              </div>
            </sc-for>
            <input class="cl-inp" placeholder="Alguma observação? Ex.: sem cebola" aria-label="Observação" value="{{mObs}}" onChange="{{setObs}}">
            <div style="display: flex; gap: 10px; align-items: center;">
              <div style="display: flex; align-items: center; gap: 4px; border: 1px solid rgba(255,255,255,.12); border-radius: 14px; padding: 4px;">
                <button type="button" aria-label="Menos um" onClick="{{qDown}}" style="width: 44px; height: 44px; border-radius: 10px; border: none; background: #202024; color: #FAFAF9; font-size: 20px;">−</button>
                <span class="num" style="min-width: 28px; text-align: center; font-weight: 800; font-size: 16px;">{{mQty}}</span>
                <button type="button" aria-label="Mais um" onClick="{{qUp}}" style="width: 44px; height: 44px; border-radius: 10px; border: none; background: #202024; color: #FAFAF9; font-size: 20px;">+</button>
              </div>
              <button type="button" onClick="{{addToCart}}" style="flex: 1 1 auto; min-height: 54px; border-radius: 14px; border: none; background: #F59E0B; color: #0F0F0F; font-weight: 800; font-size: 15px; display: flex; justify-content: space-between; align-items: center; padding: 0 16px;"><span>Adicionar</span><span class="num">{{mTotal}}</span></button>
            </div>
          </div>
        </div>
      </div>
    </sc-if>
  </sc-if>

  <sc-if value="{{isTrack}}" hint-placeholder-val="{{ false }}">
    <div class="cl-wrap" style="padding-top: 16px;">
      <div class="cl-track">
        <div style="display: flex; align-items: center; gap: 12px;">
          <button type="button" onClick="{{goMenu}}" aria-label="Voltar ao cardápio" style="width: 42px; height: 42px; border-radius: 99px; border: 1px solid rgba(255,255,255,.12); background: #18181B; color: #FAFAF9; font-size: 18px;">←</button>
          <img src="{{logo}}" alt="" style="width: 42px; height: 42px; border-radius: 12px; object-fit: cover;">
          <div style="display: flex; flex-direction: column;"><span style="font-weight: 800; font-size: 15px;">Pedido #1053</span><span style="font-size: 12px; color: #A1A1AA;">{{trackSub}}</span></div>
        </div>
        <div class="cl-card" style="padding: 22px; display: flex; flex-direction: column; gap: 8px; border-color: {{headBorder}};">
          <span style="font-size: 32px; line-height: 1;">{{headIcon}}</span>
          <span style="font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 800; font-size: 24px; line-height: 1.2;">{{headline}}</span>
          <span style="font-size: 14px; color: #D4D4D8;">{{headText}}</span>
          <span class="num" style="font-size: 16px; color: #FBBF24; font-weight: 800;">{{eta}}</span>
        </div>
        <sc-if value="{{showMap}}" hint-placeholder-val="{{ false }}">
          <div class="cl-card" style="padding: 10px; display: flex; flex-direction: column; gap: 8px;">
            <svg viewBox="0 0 360 170" width="100%" role="img" aria-label="Mapa: o motoboy está chegando" style="display: block; width: 100%; max-width: 520px; margin: 0 auto; border-radius: 12px; background: #141416;">
              <path d="M0 40H360M0 100H360M0 150H360M70 0V170M170 0V170M280 0V170" stroke="rgba(255,255,255,.06)" stroke-width="10"></path>
              <path d="M70 150 L70 100 L170 100 L170 40 L280 40" fill="none" stroke="rgba(245,158,11,.35)" stroke-width="4" stroke-dasharray="6 6"></path>
              <path d="{{routeDone}}" fill="none" stroke="#F59E0B" stroke-width="4" stroke-linecap="round"></path>
              <circle cx="280" cy="40" r="10" fill="#22C55E" stroke="#0F0F0F" stroke-width="3"></circle>
              <text x="280" y="22" fill="#86EFAC" font-size="11" font-weight="700" text-anchor="middle">Você</text>
              <circle cx="{{bikeX}}" cy="{{bikeY}}" r="14" fill="#7A1F1F" stroke="#F59E0B" stroke-width="3"></circle>
              <text x="{{bikeX}}" y="{{bikeTY}}" fill="#F5E9D7" font-size="10" font-weight="800" text-anchor="middle">LE</text>
            </svg>
            <span style="font-size: 13px; color: #D4D4D8; text-align: center;">{{mapNote}}</span>
          </div>
        </sc-if>
        <div class="cl-card" style="padding: 18px;">
          <sc-for list="{{steps}}" as="s" hint-placeholder-count="4">
            <div style="display: flex; gap: 14px;">
              <div style="display: flex; flex-direction: column; align-items: center; width: 24px;">
                <span style="width: 24px; height: 24px; border-radius: 99px; background: {{s.dotBg}}; border: 2px solid {{s.dotBorder}}; color: #0F0F0F; font-size: 12px; font-weight: 900; display: flex; align-items: center; justify-content: center; box-sizing: border-box;">{{s.mark}}</span>
                <sc-if value="{{s.notLast}}" hint-placeholder-val="{{ true }}"><span style="flex: 1 1 auto; width: 2px; min-height: 26px; background: {{s.lineColor}};"></span></sc-if>
              </div>
              <div style="display: flex; flex-direction: column; gap: 2px; padding-bottom: 16px;">
                <span style="font-size: 15px; font-weight: 700; color: {{s.color}};">{{s.label}}</span>
                <span class="num" style="font-size: 12px; color: #A1A1AA;">{{s.time}}</span>
              </div>
            </div>
          </sc-for>
        </div>
        <sc-if value="{{delivered}}" hint-placeholder-val="{{ false }}">
          <div style="padding: 18px; border-radius: 18px; background: #7A1F1F; display: flex; flex-direction: column; gap: 10px; align-items: center;">
