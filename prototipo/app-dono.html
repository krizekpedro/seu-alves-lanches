<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Seu Alves · App do dono</title>
<link rel="icon" href="https://assets.olaclick.app/companies/logos/01bf6473-9273-413d-93dd-c51f71faf7b4.webp">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0F0F0F}
a{color:#FBBF24}a:hover{color:#F59E0B}
button{font-family:inherit;cursor:pointer}
button:focus-visible{outline:2px solid #FBBF24;outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.h3{font-family:'Plus Jakarta Sans',sans-serif;font-weight:700;font-size:15px;margin:0}
.card{background:#18181B;border:1px solid rgba(255,255,255,.08);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:12px}
.row{display:flex;align-items:center;gap:10px}
.sub{font-size:12px;color:#A1A1AA}
.bar{height:8px;border-radius:99px;background:#27272A}
.bar>div{height:8px;border-radius:99px}
.btn{min-height:40px;padding:0 14px;border-radius:10px;border:none;background:#F59E0B;color:#0F0F0F;font-weight:800;font-size:13px;flex:0 0 auto}
.btn2{min-height:40px;padding:0 12px;border-radius:10px;border:1px solid rgba(245,158,11,.5);background:transparent;color:#FBBF24;font-weight:700;font-size:13px;flex:0 0 auto}
.step{width:40px;height:40px;border-radius:10px;border:1px solid rgba(255,255,255,.12);background:#202024;color:#FAFAF9;font-size:18px;font-weight:700}
</style>
<style>*{box-sizing:border-box}
html,body{height:100%}
body{display:flex;justify-content:center;align-items:center;min-height:100dvh;background:radial-gradient(circle at 50% 0%,#2a1212 0%,#0F0F0F 60%)}
#app>div{width:min(430px,100vw) !important;height:min(900px,100dvh) !important}
@media (min-width:500px){#app>div{border-radius:28px;border:1px solid rgba(245,158,11,.25);box-shadow:0 30px 80px rgba(0,0,0,.6)}}
.proto-back{position:fixed;left:12px;bottom:12px;z-index:50;padding:8px 12px;border-radius:99px;background:rgba(15,15,15,.85);border:1px solid rgba(245,158,11,.4);color:#FBBF24;font:600 12px Inter,system-ui,sans-serif;text-decoration:none}
@media (max-width:499px){.proto-phone .proto-back{display:none}}</style>
</head>
<body class="proto-phone">
<div id="app"></div>
<a class="proto-back" href="./">← Todas as telas</a>
<template id="tpl">
<div style="position: relative; width: 390px; height: 844px; box-sizing: border-box; background: #0F0F0F; color: #FAFAF9; font-family: Inter, system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden;">

  <header style="padding: 18px 16px 12px; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid rgba(255,255,255,.06);">
    <div style="width: 40px; height: 40px; border-radius: 12px; background: #7A1F1F; border: 1px solid rgba(245,158,11,.5); display: flex; align-items: center; justify-content: center; font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 800; font-size: 14px; color: #F5E9D7; flex: 0 0 auto; overflow: hidden; padding: 0;"><img src="https://assets.olaclick.app/companies/logos/01bf6473-9273-413d-93dd-c51f71faf7b4.webp" alt="Seu Alves Lanches" style="width: 100%; height: 100%; object-fit: cover;" onerror="this.replaceWith('SA')"></div>
    <div style="flex: 1 1 auto; display: flex; flex-direction: column; min-width: 0;">
      <span style="font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 800; font-size: 17px;">{{title}}</span>
      <span style="font-size: 12px; color: #A1A1AA; display: flex; align-items: center; gap: 6px;"><span style="width: 7px; height: 7px; border-radius: 99px; background: {{storeDot}};"></span>{{storeLine}}</span>
    </div>
    <button type="button" onClick="{{goHome}}" aria-label="{{bellLabel}}" style="position: relative; width: 44px; height: 44px; border-radius: 12px; border: 1px solid rgba(255,255,255,.1); background: #18181B; color: #FAFAF9; display: flex; align-items: center; justify-content: center; flex: 0 0 auto;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 8a6 6 0 1 0-12 0c0 7-3 9-3 9h18s-3-2-3-9M13.7 21a2 2 0 0 1-3.4 0"></path></svg>
      <sc-if value="{{hasTodo}}" hint-placeholder-val="{{ true }}">
        <span class="num" style="position: absolute; top: 4px; right: 4px; min-width: 18px; height: 18px; border-radius: 99px; background: #EF4444; color: #FFF; font-size: 11px; font-weight: 800; display: flex; align-items: center; justify-content: center;">{{todoCount}}</span>
      </sc-if>
    </button>
  </header>

  <sc-if value="{{toastOn}}" hint-placeholder-val="{{ false }}">
    <div role="status" style="position: absolute; left: 16px; right: 16px; bottom: 96px; z-index: 5; padding: 12px 14px; border-radius: 12px; background: #F5E9D7; color: #0F0F0F; font-size: 13px; font-weight: 600; box-shadow: 0 8px 24px rgba(0,0,0,.4); display: flex; align-items: center; gap: 10px;">
      <span style="flex: 1 1 auto;">{{toast}}</span>
      <button type="button" onClick="{{closeToast}}" aria-label="Fechar aviso" style="border: none; background: transparent; font-size: 16px; font-weight: 800; color: #0F0F0F;">×</button>
    </div>
  </sc-if>

  <div style="flex: 1 1 auto; overflow-y: auto; overflow-x: hidden; padding: 14px 16px 24px; display: flex; flex-direction: column; gap: 14px;">

    <sc-if value="{{isInicio}}" hint-placeholder-val="{{ true }}">
      <div style="display: flex; flex-direction: column; gap: 14px;">
        <div class="card" style="border-color: {{todoBorder}};">
          <div class="row" style="justify-content: space-between;">
            <h2 class="h3">Precisa de você</h2>
            <span class="num" style="font-size: 12px; font-weight: 700; padding: 4px 10px; border-radius: 99px; color: {{todoPillFg}}; background: {{todoPillBg}};">{{todoPill}}</span>
          </div>
          <sc-for list="{{todos}}" as="t" hint-placeholder-count="5">
            <div style="display: flex; flex-direction: column; gap: 10px; padding: 12px; border-radius: 12px; background: #202024; border-left: 4px solid {{t.color}};">
              <div style="display: flex; flex-direction: column; gap: 2px;">
                <span style="font-size: 14px; font-weight: 700;">{{t.title}}</span>
                <span class="sub">{{t.text}}</span>
              </div>
              <div class="row">
                <button type="button" class="btn" onClick="{{t.act}}" style="flex: 1 1 auto;">{{t.action}}</button>
                <button type="button" class="btn2" onClick="{{t.go}}">{{t.goLabel}}</button>
              </div>
            </div>
          </sc-for>
          <sc-if value="{{noTodo}}" hint-placeholder-val="{{ false }}">
            <div class="row" style="padding: 12px; border-radius: 12px; background: rgba(34,197,94,.1); color: #86EFAC; font-size: 14px; font-weight: 600;">✓ Tudo em dia. Nada esperando por você agora.</div>
          </sc-if>
        </div>

        <div class="card" style="gap: 4px;">
          <span class="sub" style="font-size: 13px;">Faturamento de hoje</span>
          <span class="num" style="font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 800; font-size: 34px; letter-spacing: -0.02em; color: #FBBF24;">R$ 3.480</span>
          <span style="font-size: 13px; font-weight: 600; color: #22C55E;">▲ 12% vs. sexta passada · meta do dia R$ 3.800</span>
          <div class="bar" style="margin-top: 8px;"><div style="width: 92%; background: #F59E0B;"></div></div>
        </div>

        <div class="card">
          <h2 class="h3">Ações rápidas</h2>
          <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px;">
            <sc-for list="{{quick}}" as="q" hint-placeholder-count="8">
              <button type="button" onClick="{{q.go}}" style="min-height: 76px; border-radius: 14px; border: 1px solid rgba(255,255,255,.08); background: #202024; color: #FAFAF9; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; padding: 6px 2px;">
                <span style="width: 34px; height: 34px; border-radius: 10px; background: {{q.bg}}; color: {{q.fg}}; display: flex; align-items: center; justify-content: center;">
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{q.icon}}"></path></svg>
                </span>
                <span style="font-size: 11px; font-weight: 600; text-align: center; line-height: 1.2;">{{q.label}}</span>
              </button>
            </sc-for>
          </div>
        </div>

        <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px;">
          <sc-for list="{{kpis}}" as="k" hint-placeholder-count="4">
            <div class="card" style="padding: 14px; gap: 4px;">
              <span class="sub">{{k.label}}</span>
              <span class="num" style="font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 800; font-size: 22px; color: {{k.color}};">{{k.value}}</span>
              <span style="font-size: 11px; color: #A1A1AA;">{{k.hint}}</span>
            </div>
          </sc-for>
        </div>

        <div class="card">
          <h2 class="h3">Agora na loja</h2>
          <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px;">
            <sc-for list="{{now}}" as="n" hint-placeholder-count="4">
              <div style="background: #202024; border-radius: 12px; padding: 10px 4px; display: flex; flex-direction: column; align-items: center; gap: 2px;">
                <span class="num" style="font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 800; font-size: 22px; color: {{n.color}};">{{n.count}}</span>
                <span style="font-size: 11px; color: #D4D4D8; text-align: center;">{{n.label}}</span>
              </div>
            </sc-for>
          </div>
        </div>
      </div>
    </sc-if>

    <sc-if value="{{isOperacao}}" hint-placeholder-val="{{ false }}">
      <div style="display: flex; flex-direction: column; gap: 14px;">
        <div class="card">
          <h2 class="h3">Loja</h2>
          <div class="row">
            <div style="flex: 1 1 auto; display: flex; flex-direction: column; gap: 2px;"><span style="font-size: 14px; font-weight: 600;">Loja aberta</span><span class="sub">fecha cardápio, WhatsApp e iFood de uma vez</span></div>
            <button type="button" role="switch" aria-checked="{{openAria}}" aria-label="Loja aberta" onClick="{{toggleOpen}}" style="{{openTrack}}"><span style="{{openKnob}}"></span></button>
          </div>
          <div style="display: flex; flex-direction: column; gap: 8px;">
            <span style="font-size: 14px; font-weight: 600;">iFood</span>
            <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px;">
              <sc-for list="{{pauseOpts}}" as="p" hint-placeholder-count="3">
                <button type="button" onClick="{{p.pick}}" style="{{p.style}}">{{p.label}}</button>
              </sc-for>
            </div>
          </div>
          <div class="row">
            <div style="flex: 1 1 auto; display: flex; flex-direction: column; gap: 2px;"><span style="font-size: 14px; font-weight: 600;">Prazo de entrega mostrado</span><span class="sub">vale para todos os canais</span></div>
            <button type="button" class="step" aria-label="Diminuir prazo" onClick="{{etaDown}}">−</button>
            <span class="num" style="min-width: 58px; text-align: center; font-weight: 800; font-size: 16px;">{{eta}} min</span>
            <button type="button" class="step" aria-label="Aumentar prazo" onClick="{{etaUp}}">+</button>
          </div>
          <div style="display: flex; flex-direction: column; gap: 6px;">
            <div class="row" style="justify-content: space-between; font-size: 13px;"><span>Ritmo da cozinha</span><span style="font-weight: 700; color: #FB923C;">7 em preparo · alto</span></div>
            <div class="bar"><div style="width: 78%; background: #FB923C;"></div></div>
          </div>
        </div>

        <div class="card">
          <div class="row" style="justify-content: space-between;"><h2 class="h3">Motoboys na rua</h2><span style="font-size: 12px; color: #86EFAC; display: flex; align-items: center; gap: 6px;"><span style="width: 7px; height: 7px; border-radius: 99px; background: #22C55E;"></span>GPS ao vivo</span></div>
          <svg viewBox="0 0 360 240" width="100%" role="img" aria-label="Mapa com a posição dos motoboys em tempo real" style="display: block; border-radius: 12px; background: #141416;">
  <g stroke="#26262B" stroke-width="7" stroke-linecap="round" fill="none">
    <path d="M0 80H360M0 130H360M0 192H360M118 0V240M180 0V240M246 0V240M300 0V240"></path>
    <path d="M40 0L120 240M262 80L330 0" stroke-width="5"></path>
  </g>
  <g stroke="#1E1E22" stroke-width="2" fill="none"><path d="M0 40H360M0 160H360M0 222H360M60 0V240M215 0V240M330 0V240"></path></g>
  <g font-family="Inter, sans-serif" font-size="9" fill="#71717A">
    <text x="268" y="30">Vila da Penha</text><text x="24" y="232">Ipase</text><text x="262" y="226">Quitungo</text><text x="190" y="120">Vila Kosmos</text>
  </g>
  <sc-for list="{{riders}}" as="r" hint-placeholder-count="3">
    <g style="opacity: {{r.op}};">
      <polyline points="{{r.done}}" fill="none" stroke="{{r.color}}" stroke-width="3" stroke-opacity=".35" stroke-linecap="round" stroke-linejoin="round"></polyline>
      <polyline points="{{r.rest}}" fill="none" stroke="{{r.color}}" stroke-width="3" stroke-dasharray="5 5" stroke-linecap="round" stroke-linejoin="round"></polyline>
      <sc-if value="{{r.hasDest}}" hint-placeholder-val="{{ true }}">
        <circle cx="{{r.dx}}" cy="{{r.dy}}" r="7" fill="#0F0F0F" stroke="{{r.color}}" stroke-width="2.5"></circle>
      </sc-if>
      <circle cx="{{r.x}}" cy="{{r.y}}" r="12" fill="{{r.color}}" stroke="#0F0F0F" stroke-width="2"></circle>
      <text x="{{r.tx}}" y="{{r.ty}}" text-anchor="middle" font-family="Inter, sans-serif" font-size="9" font-weight="800" fill="#0F0F0F">{{r.ini}}</text>
    </g>
  </sc-for>
  <rect x="168" y="118" width="24" height="24" rx="7" fill="#7A1F1F" stroke="#F59E0B" stroke-width="2"></rect>
  <text x="180" y="134" text-anchor="middle" font-family="Plus Jakarta Sans, sans-serif" font-size="9" font-weight="800" fill="#F5E9D7">SA</text>
</svg>
          <sc-for list="{{riders}}" as="r" hint-placeholder-count="3">
            <button type="button" onClick="{{r.pick}}" style="{{r.rowStyle}}">
              <span style="width: 34px; height: 34px; border-radius: 99px; background: {{r.color}}; color: #0F0F0F; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 800; flex: 0 0 auto;">{{r.ini}}</span>
              <span style="flex: 1 1 auto; display: flex; flex-direction: column; gap: 2px; min-width: 0; text-align: left;"><span style="font-size: 14px; font-weight: 700;">{{r.name}} · {{r.order}}</span><span class="sub">{{r.where}}</span></span>
              <span style="display: flex; flex-direction: column; align-items: flex-end; gap: 2px; flex: 0 0 auto;"><span class="num" style="font-size: 12px; font-weight: 700; color: {{r.statusColor}};">{{r.status}}</span><span class="num sub">{{r.km}}</span></span>
            </button>
          </sc-for>
          <button type="button" class="btn2" onClick="{{tickMap}}">Simular 1 minuto</button>
          <span class="sub" style="line-height: 1.45;">O cliente recebe um link e acompanha o mesmo trajeto. Entregas feitas pelo iFood mostram o status que o iFood envia.</span>
        </div>
        <div class="card">
          <div class="row" style="justify-content: space-between;"><h2 class="h3">Pedidos agora</h2><span class="sub">mais atrasados primeiro</span></div>
          <sc-for list="{{orders}}" as="o" hint-placeholder-count="5">
            <div style="display: flex; flex-direction: column; gap: 8px; padding: 12px; border-radius: 12px; background: #202024; border-left: 4px solid {{o.color}};">
              <div class="row">
                <span class="num" style="font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 800; font-size: 17px;">{{o.num}}</span>
                <span style="font-size: 11px; font-weight: 700; padding: 3px 8px; border-radius: 99px; color: #0F0F0F; background: {{o.chColor}};">{{o.channel}}</span>
                <span style="flex: 1 1 auto;"></span>
                <span class="num" style="font-weight: 800; color: {{o.color}};">{{o.min}}</span>
              </div>
              <span class="sub">{{o.stage}} · {{o.items}}</span>
              <sc-if value="{{o.late}}" hint-placeholder-val="{{ false }}">
                <div class="row">
                  <button type="button" class="btn" onClick="{{o.prio}}" style="flex: 1 1 0;">{{o.prioLabel}}</button>
                  <button type="button" class="btn2" onClick="{{o.warn}}" style="flex: 1 1 0;">{{o.warnLabel}}</button>
                </div>
              </sc-if>
            </div>
          </sc-for>
        </div>

        <div class="card">
          <div class="row" style="justify-content: space-between;"><h2 class="h3">Tempo por etapa hoje</h2><span class="num" style="font-weight: 800; color: #FB923C;">39:36 · meta 37:00</span></div>
          <sc-for list="{{stages}}" as="s" hint-placeholder-count="4">
            <div style="display: flex; flex-direction: column; gap: 6px;">
              <div class="row" style="justify-content: space-between; font-size: 13px;"><span>{{s.label}}</span><span class="num" style="font-weight: 700; color: {{s.color}};">{{s.avg}} <span style="color: #A1A1AA; font-weight: 400;">/ {{s.target}}</span></span></div>
              <div class="bar"><div style="width: {{s.within}}%; background: {{s.color}};"></div></div>
            </div>
          </sc-for>
          <span style="font-size: 12px; color: #FDE68A; line-height: 1.45;">Maior atraso: espera do motoboy entre 20h e 22h.</span>
        </div>
      </div>
    </sc-if>

    <sc-if value="{{isFin}}" hint-placeholder-val="{{ false }}">
      <div style="display: flex; flex-direction: column; gap: 14px;">
        <div class="card">
          <div class="row" style="justify-content: space-between;"><h2 class="h3">Contas para pagar</h2><span class="num" style="font-size: 12px; font-weight: 700; color: {{billsColor}};">{{billsPill}}</span></div>
          <sc-for list="{{bills}}" as="b" hint-placeholder-count="5">
            <div class="row" style="padding: 10px 12px; border-radius: 12px; background: #202024; opacity: {{b.op}};">
              <div style="width: 38px; flex: 0 0 auto; display: flex; flex-direction: column; align-items: center; line-height: 1.1;"><span class="num" style="font-weight: 800; font-size: 16px; color: {{b.dayColor}};">{{b.day}}</span><span style="font-size: 10px; color: #A1A1AA;">{{b.month}}</span></div>
              <div style="flex: 1 1 auto; display: flex; flex-direction: column; gap: 2px; min-width: 0;"><span style="font-size: 13px; font-weight: 600;">{{b.label}}</span><span class="num sub">{{b.value}} · <span style="color: {{b.stColor}};">{{b.status}}</span></span></div>
              <button type="button" onClick="{{b.toggle}}" style="{{b.btnStyle}}">{{b.btn}}</button>
            </div>
          </sc-for>
        </div>

        <sc-if value="{{hasConc}}" hint-placeholder-val="{{ true }}">
          <div class="card">
            <h2 class="h3">A conciliar</h2>
            <sc-for list="{{conc}}" as="c" hint-placeholder-count="2">
              <div style="display: flex; flex-direction: column; gap: 8px; padding: 12px; border-radius: 12px; background: #202024;">
                <div class="row" style="justify-content: space-between;"><span style="font-size: 13px; font-weight: 600;">{{c.label}}</span><span class="num" style="font-weight: 700;">{{c.value}}</span></div>
                <span class="sub">{{c.text}}</span>
                <button type="button" class="btn2" onClick="{{c.act}}">{{c.action}}</button>
              </div>
            </sc-for>
          </div>
        </sc-if>

        <div class="card" style="gap: 8px;">
          <span class="sub" style="font-size: 13px;">Lucro líquido do mês</span>
          <span class="num" style="font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 800; font-size: 32px; color: #FBBF24;">R$ 11.530</span>
          <span style="font-size: 13px; color: #D4D4D8;">23,9% de margem sobre R$ 48.200 · ▲ 6% vs. outubro</span>
          <div style="display: flex; gap: 8px; align-items: flex-end; height: 76px; margin-top: 4px;">
            <sc-for list="{{trend}}" as="t" hint-placeholder-count="6">
              <div style="flex: 1 1 0; display: flex; flex-direction: column; align-items: center; gap: 4px;">
                <div style="width: 100%; max-width: 30px; height: {{t.h}}px; border-radius: 5px; background: {{t.bg}};"></div>
                <span style="font-size: 10px; color: #A1A1AA;">{{t.label}}</span>
              </div>
            </sc-for>
          </div>
        </div>

        <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px;">
          <sc-for list="{{cash}}" as="c" hint-placeholder-count="3">
            <div class="card" style="padding: 12px; gap: 2px;">
              <span style="font-size: 11px; color: #A1A1AA;">{{c.label}}</span>
              <span class="num" style="font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 800; font-size: 16px; color: {{c.color}};">{{c.value}}</span>
            </div>
          </sc-for>
        </div>

        <div class="card">
          <h2 class="h3">Para onde foi o dinheiro</h2>
          <sc-for list="{{dre}}" as="d" hint-placeholder-count="7">
            <div style="display: flex; flex-direction: column; gap: 4px;">
              <div class="row" style="justify-content: space-between; font-size: 13px;"><span style="color: #E4E4E7;">{{d.label}}</span><span class="num" style="font-weight: 600; color: {{d.textColor}};">{{d.value}}</span></div>
              <div class="bar"><div style="width: {{d.w}}%; background: {{d.color}};"></div></div>
            </div>
          </sc-for>
        </div>

        <div class="card">
          <h2 class="h3">Quanto cada canal cobra</h2>
          <sc-for list="{{fees}}" as="f" hint-placeholder-count="4">
            <div style="display: flex; flex-direction: column; gap: 4px;">
              <div class="row" style="justify-content: space-between; font-size: 13px;"><span class="row" style="gap: 8px;"><span style="width: 10px; height: 10px; border-radius: 3px; background: {{f.color}};"></span>{{f.label}}</span><span class="num" style="font-weight: 700; color: {{f.pctColor}};">{{f.pct}}</span></div>
