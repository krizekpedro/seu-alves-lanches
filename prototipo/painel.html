<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Seu Alves · Painel de gestão</title>
<link rel="icon" href="../assets/img/logo.webp">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0F0F0F}
a{color:#FBBF24}a:hover{color:#F59E0B}
button{font-family:inherit;cursor:pointer}
button:focus-visible{outline:2px solid #FBBF24;outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.h3{font-family:'Plus Jakarta Sans',sans-serif;font-weight:700;font-size:15px;margin:0}
.card{background:#18181B;border:1px solid rgba(255,255,255,.08);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:12px}
.row{display:flex;align-items:center;gap:10px}
.sub{font-size:12px;color:#A1A1AA}
.bar{height:8px;border-radius:99px;background:#27272A}
.bar>div{height:8px;border-radius:99px}
.btn{min-height:40px;padding:0 14px;border-radius:10px;border:none;background:#F59E0B;color:#0F0F0F;font-weight:800;font-size:13px;flex:0 0 auto}
.btn2{min-height:40px;padding:0 12px;border-radius:10px;border:1px solid rgba(245,158,11,.5);background:transparent;color:#FBBF24;font-weight:700;font-size:13px;flex:0 0 auto}
.inp{width:100%;min-height:44px;padding:10px 12px;border-radius:10px;border:1px solid rgba(255,255,255,.12);background:#0F0F0F;color:#FAFAF9;font:500 14px Inter,system-ui,sans-serif;resize:none}
.inp:focus{outline:none;border-color:#F59E0B}
.step{width:40px;height:40px;border-radius:10px;border:1px solid rgba(255,255,255,.12);background:#202024;color:#FAFAF9;font-size:18px;font-weight:700}
.sa-mobile-user{display:none}
@media (max-width: 760px){
.sa-aside{flex:1 1 100% !important;padding:14px 14px 0 !important;gap:12px !important;border-right:none !important;border-bottom:1px solid rgba(255,255,255,.07)}
.sa-nav{display:grid !important;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px !important;padding-bottom:12px}
.sa-nav-group{display:contents !important}
.sa-hide-m{display:none !important}
.sa-show-m{display:flex !important}
.sa-tablewrap{overflow:visible !important}
.sa-table{min-width:0 !important}
.sa-thead{display:none !important}
.sa-trow{display:flex !important;flex-wrap:wrap;gap:6px 12px !important}
.sa-nav-group{flex-direction:row !important;gap:6px !important}
.sa-nav-label{display:none}
.sa-nav button{flex-direction:column !important;justify-content:center !important;gap:4px !important;min-height:58px !important;padding:6px 2px !important;font-size:10px !important;line-height:1.15 !important;text-align:center;white-space:normal !important;width:100% !important}
.sa-status{display:none !important}
.sa-main{padding:18px 14px 40px !important;gap:18px !important}
.sa-mobile-user{display:flex !important}
.sa-login-hero{padding:28px 20px !important;gap:20px !important}
.sa-login-hero p{display:none}
.sa-login-form{padding:24px 16px !important}
}
</style>
<style>*{box-sizing:border-box}
.proto-back{position:fixed;left:12px;bottom:12px;z-index:50;padding:8px 12px;border-radius:99px;background:rgba(15,15,15,.85);border:1px solid rgba(245,158,11,.4);color:#FBBF24;font:600 12px Inter,system-ui,sans-serif;text-decoration:none}
@media (max-width:499px){.proto-phone .proto-back{display:none}}</style>
</head>
<body class="">
<div id="app"></div>
<a class="proto-back" href="./">← Todas as telas</a>
<template id="tpl">
<div style="min-height: 100vh; background: #0F0F0F; color: #FAFAF9; font-family: Inter, system-ui, sans-serif; display: flex; flex-wrap: wrap;">

  <sc-if value="{{showLogin}}" hint-placeholder-val="{{ false }}">
  <div style="flex: 1 1 100%; min-height: 100vh; display: flex; flex-wrap: wrap;">
    <section class="sa-login-hero" style="flex: 1 1 380px; box-sizing: border-box; padding: 48px; background: #7A1F1F; display: flex; flex-direction: column; justify-content: space-between; gap: 40px;">
      <div style="display: flex; align-items: center; gap: 14px;">
        <div style="width: 56px; height: 56px; border-radius: 16px; background: #0F0F0F; border: 1px solid rgba(245,158,11,.6); display: flex; align-items: center; justify-content: center; font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 800; font-size: 20px; color: #F5E9D7; overflow: hidden; padding: 0;"><img src="../assets/img/logo.webp" alt="Seu Alves Lanches" style="width: 100%; height: 100%; object-fit: cover;" onerror="this.replaceWith('SA')"></div>
        <div style="display: flex; flex-direction: column;">
          <span style="font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 800; font-size: 22px; color: #F5E9D7;">Seu Alves</span>
          <span style="font-size: 13px; color: #E7D2B3;">Gestão de Delivery · Vila Kosmos</span>
        </div>
      </div>
      <div style="display: flex; flex-direction: column; gap: 14px; max-width: 420px;">
        <h1 style="margin: 0; font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 800; font-size: 40px; line-height: 1.08; letter-spacing: -0.02em; color: #F5E9D7;">Bom turno, equipe.</h1>
        <p style="margin: 0; font-size: 16px; line-height: 1.5; color: #E7D2B3;">Cada pessoa entra com o próprio acesso. Assim o sistema sabe quem aceitou, preparou, vendeu ou deu desconto, e cada um vê só as telas da sua função.</p>
      </div>
      <span style="font-size: 13px; color: #E7D2B3;">Loja aberta · 18h às 23h30</span>
    </section>

    <section class="sa-login-form" style="flex: 999 1 460px; box-sizing: border-box; padding: 48px 32px; background: #0F0F0F; display: flex; justify-content: center;">
      <div style="width: 100%; max-width: 560px; display: flex; flex-direction: column; gap: 24px;">
        <div role="tablist" aria-label="Tipo de acesso" style="display: flex; gap: 4px; padding: 4px; border-radius: 14px; background: #18181B; border: 1px solid rgba(255,255,255,.08);">
          <sc-for list="{{loginTabs}}" as="t" hint-placeholder-count="2">
            <button type="button" role="tab" onClick="{{t.pick}}" style="{{t.style}}">{{t.label}}</button>
          </sc-for>
        </div>

        <sc-if value="{{loginPin}}" hint-placeholder-val="{{ true }}">
          <div style="display: flex; flex-direction: column; gap: 20px;">
            <div style="display: flex; flex-direction: column; gap: 4px;">
              <h2 style="margin: 0; font-family: 'Plus Jakarta Sans', sans-serif; font-size: 22px; font-weight: 800;">Quem está entrando?</h2>
              <span style="font-size: 14px; color: #A1A1AA;">Toque no seu nome e digite seu PIN de 4 números.</span>
            </div>
            <div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px;">
              <sc-for list="{{staff}}" as="p" hint-placeholder-count="5">
                <button type="button" onClick="{{p.pick}}" style="{{p.style}}">
                  <span style="width: 44px; height: 44px; border-radius: 99px; background: {{p.avatarBg}}; color: {{p.avatarFg}}; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 15px;">{{p.initials}}</span>
                  <span style="font-size: 15px; font-weight: 700;">{{p.name}}</span>
                  <span style="font-size: 12px; color: #A1A1AA;">{{p.role}}</span>
                </button>
              </sc-for>
            </div>
            <sc-if value="{{hasPick}}" hint-placeholder-val="{{ true }}">
              <div style="display: flex; flex-direction: column; align-items: center; gap: 16px; padding: 20px; border-radius: 16px; background: #18181B; border: 1px solid rgba(255,255,255,.08);">
                <span style="font-size: 15px; color: #E4E4E7;">PIN de <strong style="color: #FBBF24;">{{pickName}}</strong></span>
                <div aria-label="Dígitos digitados" style="display: flex; gap: 14px;">
                  <sc-for list="{{pinDots}}" as="d" hint-placeholder-count="4">
                    <span style="width: 16px; height: 16px; border-radius: 99px; border: 2px solid #F59E0B; background: {{d.bg}};"></span>
                  </sc-for>
                </div>
                <div style="display: grid; grid-template-columns: repeat(3, 72px); gap: 10px;">
                  <sc-for list="{{keys}}" as="k" hint-placeholder-count="12">
                    <button type="button" onClick="{{k.press}}" aria-label="{{k.aria}}" style="{{k.style}}">{{k.label}}</button>
                  </sc-for>
                </div>
                <span style="font-size: 12px; color: #A1A1AA;">No protótipo, qualquer PIN de 4 números entra.</span>
              </div>
            </sc-if>
          </div>
        </sc-if>

        <sc-if value="{{loginEmail}}" hint-placeholder-val="{{ false }}">
          <div style="display: flex; flex-direction: column; gap: 16px;">
            <div style="display: flex; flex-direction: column; gap: 4px;">
              <h2 style="margin: 0; font-family: 'Plus Jakarta Sans', sans-serif; font-size: 22px; font-weight: 800;">Acesso do dono e gerentes</h2>
              <span style="font-size: 14px; color: #A1A1AA;">Para entrar de qualquer lugar, pelo celular ou computador.</span>
            </div>
            <label for="loginEmail" style="font-size: 13px; color: #D4D4D8;">E-mail ou celular</label>
            <input id="loginEmail" type="text" placeholder="voce@seualves.com.br" style="min-height: 48px; box-sizing: border-box; padding: 0 14px; border-radius: 12px; border: 1px solid rgba(255,255,255,.12); background: #18181B; color: #FAFAF9; font-size: 15px;">
            <label for="loginPass" style="font-size: 13px; color: #D4D4D8;">Senha</label>
            <input id="loginPass" type="password" placeholder="••••••••" style="min-height: 48px; box-sizing: border-box; padding: 0 14px; border-radius: 12px; border: 1px solid rgba(255,255,255,.12); background: #18181B; color: #FAFAF9; font-size: 15px;">
            <button type="button" onClick="{{emailLogin}}" style="min-height: 52px; border-radius: 12px; border: none; background: #F59E0B; color: #0F0F0F; font-weight: 800; font-size: 16px;">Entrar</button>
            <span style="font-size: 13px; color: #A1A1AA;">Confirmação por código no WhatsApp ao entrar de um aparelho novo. <a href="#">Esqueci a senha</a></span>
          </div>
        </sc-if>
      </div>
    </section>
  </div>
  </sc-if>

  <sc-if value="{{loggedIn}}" hint-placeholder-val="{{ true }}">
  <aside class="sa-aside" style="flex: 1 1 220px; box-sizing: border-box; padding: 24px 16px; background: #0A0A0A; border-right: 1px solid rgba(255,255,255,.07); display: flex; flex-direction: column; gap: 28px;">
    <div style="display: flex; align-items: center; gap: 12px; padding: 0 8px;">
      <div style="width: 44px; height: 44px; border-radius: 12px; background: #7A1F1F; border: 1px solid rgba(245,158,11,.5); display: flex; align-items: center; justify-content: center; font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 800; font-size: 16px; color: #F5E9D7; overflow: hidden; padding: 0;"><img src="../assets/img/logo.webp" alt="Seu Alves Lanches" style="width: 100%; height: 100%; object-fit: cover;" onerror="this.replaceWith('SA')"></div>
      <div style="display: flex; flex-direction: column;">
        <span style="font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 800; font-size: 16px; color: #F5E9D7;">Seu Alves</span>
        <span style="font-size: 12px; color: #A1A1AA;">Gestão de Delivery</span>
      </div>
    </div>
    <nav class="sa-nav" aria-label="Seções" style="display: flex; flex-direction: column; gap: 18px;">
      <sc-for list="{{navGroups}}" as="g" hint-placeholder-count="3">
        <div class="sa-nav-group" style="display: flex; flex-direction: column; gap: 2px;">
          <span class="sa-nav-label" style="padding: 0 14px 6px; font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: #8B8B94;">{{g.label}}</span>
          <sc-for list="{{g.items}}" as="n" hint-placeholder-count="4">
            <button type="button" onClick="{{n.pick}}" style="{{n.style}}">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{n.icon}}"></path></svg>
              <span>{{n.label}}</span>
            </button>
          </sc-for>
        </div>
      </sc-for>
    </nav>
    <div class="sa-status" style="margin-top: auto; display: flex; flex-direction: column; gap: 10px; padding: 14px; border-radius: 14px; background: #18181B; border: 1px solid rgba(255,255,255,.07); font-size: 13px;">
      <div style="display: flex; align-items: center; gap: 10px; padding-bottom: 10px; border-bottom: 1px solid rgba(255,255,255,.07);">
        <span style="width: 36px; height: 36px; border-radius: 99px; background: #F59E0B; color: #0F0F0F; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 13px; flex: 0 0 auto;">{{userInitials}}</span>
        <div style="flex: 1 1 auto; display: flex; flex-direction: column; min-width: 0;">
          <span style="font-weight: 700; color: #FAFAF9;">{{userName}}</span>
          <span style="font-size: 12px; color: #A1A1AA;">{{userRole}}</span>
        </div>
      </div>
      <button type="button" onClick="{{logout}}" style="min-height: 40px; border-radius: 10px; border: 1px solid rgba(255,255,255,.12); background: transparent; color: #E4E4E7; font-weight: 600; font-size: 13px;">Trocar usuário</button>
      <span style="font-weight: 600; color: #F5E9D7;">Loja Vila Kosmos</span>
      <span style="display: flex; align-items: center; gap: 8px; color: #D4D4D8;"><span style="width: 8px; height: 8px; border-radius: 99px; background: #22C55E;"></span>Aberta · 18h às 23h30</span>
      <span style="display: flex; align-items: center; gap: 8px; color: #D4D4D8;"><span style="width: 8px; height: 8px; border-radius: 99px; background: #22C55E;"></span>iFood conectado · há 12 s</span>
      <span style="display: flex; align-items: center; gap: 8px; color: #D4D4D8;"><span style="width: 8px; height: 8px; border-radius: 99px; background: #22C55E;"></span>Impressoras: 2 de 2</span>
    </div>
  </aside>

  <main class="sa-main" style="flex: 999 1 560px; min-width: 0; box-sizing: border-box; padding: 28px 32px 48px; display: flex; flex-direction: column; gap: 24px;">

    <header style="display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 16px;">
      <div style="display: flex; flex-direction: column; gap: 4px;">
        <span style="font-size: 13px; color: #A1A1AA;">Sexta, 27 de novembro · dados de exemplo</span>
        <h1 style="margin: 0; font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 800; font-size: 30px; letter-spacing: -0.02em;">{{screenTitle}}</h1>
      </div>
      <div style="display: flex; flex-wrap: wrap; gap: 8px; align-items: center;">
        <sc-if value="{{showPeriod}}" hint-placeholder-val="{{ true }}">
          <div role="group" aria-label="Período" style="display: flex; gap: 4px; padding: 4px; border-radius: 12px; background: #18181B; border: 1px solid rgba(255,255,255,.08);">
            <sc-for list="{{periods}}" as="p" hint-placeholder-count="3">
              <button type="button" onClick="{{p.pick}}" style="{{p.style}}">{{p.label}}</button>
            </sc-for>
          </div>
        </sc-if>
        <button type="button" onClick="{{logout}}" class="sa-mobile-user" aria-label="Trocar usuário" style="min-height: 44px; padding: 0 12px 0 6px; align-items: center; gap: 8px; border-radius: 12px; background: #18181B; border: 1px solid rgba(255,255,255,.08); color: #FAFAF9; font-size: 14px;"><span style="width: 32px; height: 32px; border-radius: 99px; background: #F59E0B; color: #0F0F0F; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 12px;">{{userInitials}}</span>Trocar</button>
        <button type="button" style="min-height: 44px; padding: 0 14px; border-radius: 12px; background: #18181B; border: 1px solid rgba(255,255,255,.08); color: #FAFAF9; font-size: 14px;">Todos os canais ▾</button>
        <button type="button" style="min-height: 44px; padding: 0 14px; border-radius: 12px; background: #18181B; border: 1px solid rgba(255,255,255,.08); color: #FAFAF9; font-size: 14px;">Vila Kosmos ▾</button>
      </div>
    </header>

    <sc-if value="{{isPainel}}" hint-placeholder-val="{{ true }}">
      <div style="display: flex; flex-direction: column; gap: 20px;">
        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 16px;">
          <sc-for list="{{kpis}}" as="k" hint-placeholder-count="5">
            <div style="background: #18181B; border: 1px solid rgba(255,255,255,.08); border-radius: 16px; padding: 18px 20px; display: flex; flex-direction: column; gap: 10px;">
              <span style="font-size: 13px; color: #A1A1AA;">{{k.label}}</span>
              <span class="num" style="font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 800; font-size: 28px; letter-spacing: -0.02em; color: {{k.valueColor}};">{{k.value}}</span>
              <div style="display: flex; align-items: center; justify-content: space-between; gap: 8px;">
                <span style="font-size: 13px; font-weight: 600; color: {{k.deltaColor}};">{{k.delta}}</span>
                <svg width="96" height="30" viewBox="0 0 96 30" aria-hidden="true"><polyline points="{{k.points}}" fill="none" stroke="#F59E0B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></polyline></svg>
              </div>
              <span style="font-size: 12px; color: #A1A1AA;">{{k.hint}}</span>
            </div>
          </sc-for>
        </div>

        <div class="card" style="gap: 12px;">
          <div style="display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; flex-wrap: wrap;">
            <div style="display: flex; flex-direction: column; gap: 2px; min-width: 0;">
              <h2 class="h3" style="margin: 0;">Tendência de vendas</h2>
              <span class="sub">{{trTitle}}</span>
              <span class="num" style="font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 800; font-size: 26px; color: #FBBF24;">{{trTotal}}</span>
              <span style="font-size: 12px; font-weight: 600; color: {{trVarColor}};">{{trVar}}</span>
            </div>
            <div style="display: flex; flex-direction: column; gap: 6px; align-items: flex-end;">
              <div style="display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end;"><sc-for list="{{trPeriods}}" as="p" hint-placeholder-count="3"><button type="button" style="{{p.style}}" onClick="{{p.pick}}">{{p.label}}</button></sc-for></div>
              <div style="display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end;"><sc-for list="{{trMetrics}}" as="p" hint-placeholder-count="2"><button type="button" style="{{p.style}}" onClick="{{p.pick}}">{{p.label}}</button></sc-for></div>
            </div>
          </div>
          <svg viewBox="0 0 320 130" width="100%" preserveAspectRatio="none" role="img" aria-label="{{trAria}}" style="display: block; height: 230px;">
            <defs><linearGradient id="trGrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F59E0B" stop-opacity="0.35"></stop><stop offset="1" stop-color="#F59E0B" stop-opacity="0"></stop></linearGradient></defs>
            <path d="M0 42H320M0 83H320M0 124H320" stroke="rgba(255,255,255,.06)" stroke-width="1" vector-effect="non-scaling-stroke"></path>
            <path d="{{trArea}}" fill="url(#trGrad)"></path>
            <path d="{{trPrev}}" fill="none" stroke="#71717A" stroke-width="1.5" stroke-dasharray="4 4" vector-effect="non-scaling-stroke"></path>
            <path d="{{trLine}}" fill="none" stroke="#F59E0B" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"></path>
          </svg>
          <div style="display: flex; justify-content: space-between; gap: 4px; margin-top: -4px;"><sc-for list="{{trLabels}}" as="l" hint-placeholder-count="6"><span class="num" style="font-size: 10px; color: #A1A1AA;">{{l.t}}</span></sc-for></div>
          <div style="display: flex; gap: 14px; flex-wrap: wrap; font-size: 11px; color: #A1A1AA;"><span><span style="display: inline-block; width: 14px; height: 3px; border-radius: 2px; background: #F59E0B; vertical-align: middle;"></span> Este período</span><span><span style="display: inline-block; width: 14px; border-top: 2px dashed #71717A; vertical-align: middle;"></span> Período anterior</span></div>
          <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 8px;">
            <sc-for list="{{trInsights}}" as="i" hint-placeholder-count="4">
              <div style="padding: 10px 12px; border-radius: 12px; background: #202024; display: flex; flex-direction: column; gap: 2px;"><span style="font-size: 11px; color: #A1A1AA;">{{i.k}}</span><span style="font-size: 14px; font-weight: 700; color: #F5E9D7;">{{i.v}}</span></div>
            </sc-for>
          </div>
        </div>

        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 16px;">
          <section style="background: #18181B; border: 1px solid rgba(255,255,255,.08); border-radius: 16px; padding: 20px; display: flex; flex-direction: column; gap: 16px;">
            <div style="display: flex; justify-content: space-between; align-items: baseline; gap: 8px;">
              <h2 style="margin: 0; font-family: 'Plus Jakarta Sans', sans-serif; font-size: 17px; font-weight: 700;">{{barsTitle}}</h2>
              <span style="font-size: 12px; color: #A1A1AA;">pico em dourado</span>
            </div>
            <div style="height: 220px; display: flex; align-items: flex-end; gap: 6px;">
              <sc-for list="{{bars}}" as="b" hint-placeholder-count="8">
                <div style="flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 6px; height: 100%;">
                  <span class="num" style="font-size: 11px; color: #D4D4D8;">{{b.value}}</span>
                  <div style="width: 100%; max-width: 40px; border-radius: 8px 8px 3px 3px; height: {{b.h}}px; background: {{b.color}};"></div>
                  <span style="font-size: 11px; color: #A1A1AA;">{{b.label}}</span>
                </div>
              </sc-for>
            </div>
          </section>

          <section style="background: #18181B; border: 1px solid rgba(255,255,255,.08); border-radius: 16px; padding: 20px; display: flex; flex-direction: column; gap: 16px;">
            <h2 style="margin: 0; font-family: 'Plus Jakarta Sans', sans-serif; font-size: 17px; font-weight: 700;">Faturamento por canal</h2>
            <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 28px;">
              <div style="position: relative; width: 180px; height: 180px; flex: 0 0 auto;">
